name: Tolvix functional browser smoke tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/playwright-tool-smoke.cjs'
      - '.github/workflows/playwright-tool-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox webkit
      - name: Test all live tool pages
        run: node scripts/playwright-tool-smoke.cjs
      - name: Test real calculations, chemistry, physics and file outputs
        run: node scripts/playwright-tool-functional.cjs
      - name: Upload detailed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tolvix-playwright-tool-smoke-results
          path: playwright-report/
          if-no-files-found: warn

name: Physics calculator tests
on:
  push:
    branches: [main]
    paths:
      - 'assets/physics-core.js'
      - 'scripts/test-physics-tools.cjs'
      - '.github/workflows/physics-tests.yml'
  pull_request:
    paths:
      - 'assets/physics-core.js'
      - 'scripts/test-physics-tools.cjs'
      - '.github/workflows/physics-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-physics-tools.cjs
